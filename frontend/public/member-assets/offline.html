<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf5ec" />
    <title>Offline · Paddy Member</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        background: #fbf5ec; color: #2a1024; font-family: Nunito, system-ui, -apple-system, sans-serif; text-align: center;
      }
      main { max-width: 22rem; padding: 2rem 1.5rem; }
      img { width: 72px; height: 72px; border-radius: 20px; }
      h1 { font-size: 1.6rem; margin: 1.25rem 0 0.5rem; }
      p { color: #58524c; line-height: 1.5; margin: 0; }
      button {
        margin-top: 1.5rem; border: 0; border-radius: 1rem; padding: 0.9rem 1.4rem;
        background: #e3066f; color: #ffffff; font-weight: 800; font-size: 1rem;
        border: 2px solid #232c6b; box-shadow: 3px 3px 0 #232c6b;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/member-assets/icons/icon-192.png" alt="Paddy" />
      <h1>Anda sedang offline</h1>
      <p>Portal member butuh internet untuk memuat saldo dan riwayat terbaru. Sambungkan lagi, lalu coba muat ulang.</p>
      <p lang="en" style="margin-top: 0.75rem; font-size: 0.85rem">You are offline. Reconnect, then reload.</p>
      <button type="button" onclick="location.reload()">Muat ulang</button>
    </main>
  </body>
</html>
